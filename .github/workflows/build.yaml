name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.config }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_CI_BUILD=ON `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Install
        run: cmake --install build --config ${{ matrix.config }}

      - name: Package
        shell: cmd
        run: package.bat ${{ matrix.config }}

      - name: Upload main zip
        if: matrix.config == 'RelWithDebInfo'
        uses: actions/upload-artifact@v4
        with:
          name: input_loader_${{ github.sha }}
          path: dist/input_loader_v*.zip

      - name: Upload pdb zip
        if: matrix.config == 'RelWithDebInfo'
        uses: actions/upload-artifact@v4
        with:
          name: input_loader_${{ github.sha }}_pdb
          path: dist/input_loader_v*_pdb.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.config == 'RelWithDebInfo'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/input_loader_v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
